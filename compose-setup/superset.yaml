apiVersion: apps/v1
kind: Deployment
metadata:
  name: superset
  namespace: bigdata-pipeline
spec:
  replicas: 1
  selector:
    matchLabels:
      app: superset
  template:
    metadata:
      labels:
        app: superset
    spec:
      containers:
        - name: superset
          image: apache/superset:3.1.0
          ports:
            - containerPort: 8088
          env:
            - name: SUPERSET_SECRET_KEY
              value: "B1gD4t4Pip3lin3-S3cr3t-K3y"
            - name: SUPERSET_PORT
              value: "8088"
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi" 
              cpu: "1000m"  
          livenessProbe:
            httpGet:
              path: /health
              port: 8088
            initialDelaySeconds: 180  # Chờ 3 phút cho Superset khởi động
            periodSeconds: 20
            timeoutSeconds: 15
            failureThreshold: 5