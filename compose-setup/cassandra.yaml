apiVersion: v1
kind: Service
metadata:
  name: cassandra
  namespace: bigdata-pipeline
spec:
  clusterIP: None
  selector:
    app: cassandra
  ports:
    - port: 9042
      targetPort: 9042
      name: cql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cassandra
  namespace: bigdata-pipeline
spec:
  serviceName: cassandra
  replicas: 1
  selector:
    matchLabels:
      app: cassandra
  template:
    metadata:
      labels:
        app: cassandra
    spec:
      containers:
        - name: cassandra
          image: cassandra:latest
          env:
            - name: CASSANDRA_SEEDS
              value: cassandra-0.cassandra.bigdata-pipeline.svc.cluster.local
          ports:
            - containerPort: 9042
          volumeMounts:
            - name: cassandra-data
              mountPath: /var/lib/cassandra
  volumeClaimTemplates:
    - metadata:
        name: cassandra-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---